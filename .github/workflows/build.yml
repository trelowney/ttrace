name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Dependencies
        run: go mod tidy && git diff --stat

      - name: Formatting (only reported)
        run: gofmt -d . || true

      - name: Vet (linux, macOS, windows)
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}" ;;
            *) V="dev-${GITHUB_SHA::7}" ;;
          esac
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$V" \
              -o "dist/ttrace-$os-$arch$ext" ./cmd/ttrace
          done
          ls -l dist

      # Builds of main are only checked, not stored; only tagged versions are published.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease" ;; esac  # 0.x = in development
          gh release create "$GITHUB_REF_NAME" dist/* --title "ttrace $GITHUB_REF_NAME" --generate-notes $pre
