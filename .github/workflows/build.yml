name: build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Dependencies
        run: go mod tidy && git diff --stat

      - name: Formatting (only reported)
        run: gofmt -d . || true

      - name: Vet (linux, macOS, windows)
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...

      - name: Test
        run: go test -timeout 2m ./...  # a stuck test fails quickly instead of after 10 minutes

      - name: Build
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}" ;;
            *) V="dev-${GITHUB_SHA::7}" ;;
          esac
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$V" \
              -o "dist/ttrace-$os-$arch$ext" ./cmd/ttrace
          done
          ls -l dist

      - name: Debian packages
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}" ;;
            *) V="0.0~dev+${GITHUB_SHA::7}" ;;
          esac
          for a in amd64 arm64; do packaging/deb.sh "$V" $a dist/ttrace-linux-$a dist; done
          ls -l dist/*.deb

      # Installs the package like a user would and runs ttrace as a normal
      # user: the package must allow raw sockets by itself.
      - name: Test the package
        run: |
          sudo apt-get install -y ./dist/ttrace_*_amd64.deb
          getcap /usr/bin/ttrace | grep -q cap_net_raw
          ttrace --version
          ttrace -r -c 2 -m 3 -n --no-as --no-geo 127.0.0.1 | tee out.txt
          grep -q '127.0.0.1' out.txt
          ttrace 127.0.0.1 -r -c 1 -m 2 -n --no-as --no-geo -4 | grep -q '127.0.0.1'   # options after the host
          sudo apt-get remove -y ttrace

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      # Builds of main are only checked, not stored; only tagged versions are published.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "ttrace $GITHUB_REF_NAME" --generate-notes

  # APT repository on GitHub Pages (gh-pages branch). Every build makes and
  # tests it locally; only tagged versions are published.
  apt:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Build and sign the repository
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          sudo apt-get install -y apt-utils >/dev/null
          echo "$APT_GPG_KEY" | gpg --batch --import
          packaging/apt-repo.sh site dist
          find site -path site/.git -prune -o -type f -print | sort

      # Installs from the freshly made repository (as files) in clean
      # Debian and Ubuntu, checking the signature, before anything is published.
      - name: Test the repository
        run: |
          for img in debian:stable-slim ubuntu:24.04; do
            docker run --rm -v "$PWD/site:/repo:ro" $img sh -ec '
              apt-get -qq update >/dev/null
              mkdir -p /etc/apt/keyrings
              cp /repo/ttrace.asc /etc/apt/keyrings/ttrace.asc
              echo "deb [signed-by=/etc/apt/keyrings/ttrace.asc] file:/repo stable main" > /etc/apt/sources.list.d/ttrace.list
              apt-get -qq update
              apt-get -qq install -y ttrace >/dev/null
              getcap /usr/bin/ttrace
              ttrace --version'
          done

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: site
        run: |
          git config user.name trelowney
          git config user.email 54177826+trelowney@users.noreply.github.com
          git add -A
          git commit -q -m "ttrace $GITHUB_REF_NAME"
          git push

  # Checks the published repository the way people use it.
  apt-check:
    needs: apt
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Install from trelowney.github.io
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 40); do   # GitHub Pages takes a moment to publish
            curl -fsSL https://trelowney.github.io/ttrace/dists/stable/main/binary-amd64/Packages | grep -q "^Version: $V$" && break
            sleep 15
          done
          for img in debian:stable-slim ubuntu:24.04; do
            docker run --rm $img sh -ec '
              apt-get -qq update >/dev/null && apt-get -qq install -y curl ca-certificates >/dev/null
              mkdir -p /etc/apt/keyrings
              curl -fsSL -o /etc/apt/keyrings/ttrace.asc https://trelowney.github.io/ttrace/ttrace.asc
              echo "deb [signed-by=/etc/apt/keyrings/ttrace.asc] https://trelowney.github.io/ttrace stable main" > /etc/apt/sources.list.d/ttrace.list
              apt-get -qq update
              apt-get -qq install -y ttrace >/dev/null
              ttrace --version' | tee out.txt
            grep -q "ttrace $V" out.txt
          done

  # Homebrew formula. Every build installs it from local files on a Mac;
  # tagged versions are published and installed again from GitHub.
  brew:
    needs: build
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install from local files
        run: |
          V=$(sh -c 'case "$GITHUB_REF" in refs/tags/v*) echo "${GITHUB_REF_NAME#v}" ;; *) echo 0.0.0 ;; esac')
          # a git repository laid out like this one, tapped the same way people do
          mkdir -p "$RUNNER_TEMP/taprepo/Formula"
          packaging/brew-formula.sh "$V" "file://$PWD/dist" dist > "$RUNNER_TEMP/taprepo/Formula/ttrace.rb"
          git -C "$RUNNER_TEMP/taprepo" init -q
          git -C "$RUNNER_TEMP/taprepo" add -A
          git -C "$RUNNER_TEMP/taprepo" -c user.name=ci -c user.email=ci@example.com commit -q -m formula
          brew tap local/ttrace "$RUNNER_TEMP/taprepo"
          brew install local/ttrace/ttrace
          ttrace --version
          sudo ttrace -r -c 2 -m 3 -n --no-as --no-geo 127.0.0.1 | tee out.txt
          grep -q 127.0.0.1 out.txt
          brew test local/ttrace/ttrace || true   # the dev build's version is not 0.0.0
          brew uninstall ttrace
          brew untap local/ttrace

      # The formula lives in this repository (Formula/ttrace.rb), so no
      # separate tap repository is needed.
      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          ref: main
          path: main

      - name: Publish the formula
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p main/Formula
          packaging/brew-formula.sh "$V" "https://github.com/trelowney/ttrace/releases/download/$GITHUB_REF_NAME" dist > main/Formula/ttrace.rb
          cd main
          git config user.name trelowney
          git config user.email 54177826+trelowney@users.noreply.github.com
          git add Formula/ttrace.rb
          git commit -q -m "Homebrew formula for ttrace $V"
          git push -q

      - name: Install with Homebrew as people do
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          brew tap trelowney/ttrace https://github.com/trelowney/ttrace
          brew install trelowney/ttrace/ttrace
          ttrace --version | grep -q "ttrace ${GITHUB_REF_NAME#v}"
          brew test trelowney/ttrace/ttrace

  # winget: the manifests are made, checked with winget itself and installed
  # the way people do on every build (from the newest release when this is
  # not a tagged version). Tagged versions are then sent to
  # microsoft/winget-pkgs by packaging/winget-pr.py with the WINGET_TOKEN
  # secret; an open, not yet accepted pull request is switched to the new
  # version instead of opening a second one.
  winget:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist
          path: dist

      - name: Make the manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) TAG="$GITHUB_REF_NAME" ;;
            *) TAG=$(gh release view --json tagName -q .tagName)
               mkdir -p dist
               gh release download "$TAG" -p 'ttrace-windows-*.exe' -D dist ;;
          esac
          packaging/winget.sh "${TAG#v}" "https://github.com/trelowney/ttrace/releases/download/$TAG" dist winget
          echo "V=${TAG#v}" >> "$GITHUB_ENV"
          cat winget/*.yaml

      - name: Check and install with winget
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the winget update reads GitHub with it (no anonymous rate limit)
        run: |
          # the runner's winget can be older than the manifest schema; check
          # with the newest one, like the winget-pkgs validation does
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
          for ($i = 1; $i -le 3; $i++) {
            try { Repair-WinGetPackageManager -Latest -Force; break }
            catch { if ($i -eq 3) { throw }; Write-Output "winget update failed ($_), trying again"; Start-Sleep 20 }
          }
          winget --version
          winget validate --manifest winget
          if ($LASTEXITCODE -ne 0) { Write-Error 'winget validate failed'; exit 1 }
          winget settings --enable LocalManifestFiles
          winget install --manifest winget --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { Write-Error 'winget install failed'; exit 1 }
          $links = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
          $out = & (Join-Path $links 'ttrace.exe') --version
          Write-Output $out
          if ("$out" -notmatch [regex]::Escape("ttrace $env:V")) { Write-Error 'the installed ttrace is not the right version'; exit 1 }
          winget uninstall --manifest winget --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { Write-Error 'winget uninstall failed'; exit 1 }

      - name: Send to winget
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::The WINGET_TOKEN secret is missing, so nothing was sent to winget."; exit 1; fi
          python packaging/winget-pr.py "$V" winget

  # Windows window (WinUI 3): one ttrace-gui-windows-<cpu>.exe with
  # everything inside, ttrace.exe too. Nothing to unpack or install.
  gui:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, goarch: amd64, platform: x64 }
          - { arch: arm64, goarch: arm64, platform: ARM64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}"; NV="-p:Version=${V%%-*}" ;;
            *) V="dev-${GITHUB_SHA::7}"; NV="" ;;
          esac
          go mod tidy
          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-s -w -X main.version=$V" -o gui/ttrace.exe ./cmd/ttrace
          dotnet publish gui/TtraceGui.csproj -c Release -r win-${{ matrix.arch }} \
            -p:Platform=${{ matrix.platform }} $NV -o out
          ls -la out
          cp out/ttrace-gui.exe ttrace-gui-windows-${{ matrix.arch }}.exe

      # Starts the published file exactly as people download it, traces a
      # host and checks that results arrived.
      - name: Self-test
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $res = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $p = Start-Process -FilePath .\ttrace-gui-windows-x64.exe -ArgumentList '--selftest', $res, '1.1.1.1' -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Error 'the window did not finish in time' }
          $crash = Join-Path $env:LOCALAPPDATA 'ttrace\gui-crash.txt'
          if (Test-Path $crash) { Get-Content $crash }
          if (-not (Test-Path $res)) {
            # find out why: does the original name work, and where are the .pri files?
            $res2 = Join-Path $env:RUNNER_TEMP 'selftest2.txt'
            $q = Start-Process -FilePath out\ttrace-gui.exe -ArgumentList '--selftest', $res2, '1.1.1.1' -PassThru
            if (-not $q.WaitForExit(150000)) { $q.Kill() }
            if (Test-Path $res2) { Write-Output ("original name: " + (Get-Content $res2)) } else { Write-Output 'original name: no result' }
            Get-ChildItem -Recurse -Filter *.pri (Join-Path $env:TEMP '.net') | ForEach-Object { $_.FullName }
            Write-Error 'no result was written'; exit 1
          }
          $line = Get-Content $res
          Write-Output $line
          if (-not $line.StartsWith('ok ')) { exit 1 }

      # The runners get no traceroute answers, so the map stays empty there.
      # Show saved results instead and keep a picture of the window to look at.
      - name: Self-test with saved results
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $res = Join-Path $env:RUNNER_TEMP 'replay.txt'
          $p = Start-Process -FilePath .\ttrace-gui-windows-x64.exe -ArgumentList '--selftest', $res, 'example.net', '--replay', (Resolve-Path gui\testdata\replay.jsonl).Path -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error 'the window did not finish in time' }
          if (-not (Test-Path $res)) { Write-Error 'no result was written'; exit 1 }
          $line = Get-Content $res
          Write-Output $line
          if (-not $line.StartsWith('ok ')) { exit 1 }
          if (-not (Test-Path "$res.png")) { Write-Error 'no picture of the window'; exit 1 }

      - name: Picture of the window
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-window
          path: |
            ${{ runner.temp }}/selftest.txt.png
            ${{ runner.temp }}/replay.txt.png
          retention-days: 1
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ttrace-gui-windows-${{ matrix.arch }}.exe --clobber

  gui-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}"; AV="${V%%-*}" ;;
            *) V="dev-${GITHUB_SHA::7}"; AV="0.0.0" ;;
          esac
          go mod tidy
          gui-macos/build.sh "$V" "$AV"

      # ICMP must work without sudo on macOS (datagram ICMP socket); with
      # sudo the raw socket is used. UDP probes still need sudo and say so.
      - name: Test the command line program
        run: |
          T=gui-macos/build/ttrace.app/Contents/MacOS/ttrace
          $T --version
          echo "--- ICMP without sudo"
          $T -r -c 3 -n --no-geo 1.1.1.1 | tee plain.txt
          grep -Eq '^ *[0-9]+\. +[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' plain.txt
          echo "--- options after the host"
          $T 1.1.1.1 -r -c 2 -n --no-geo -4
          echo "--- ICMP with sudo"
          sudo $T -r -c 2 -n --no-geo 1.1.1.1
          echo "--- UDP without sudo must explain itself"
          if $T -r -c 1 -n --no-geo -P udp 1.1.1.1 2> udp.txt; then echo "UDP worked without sudo"; else cat udp.txt; grep -q sudo udp.txt; fi

      - name: Package
        run: |
          cd gui-macos/build
          ditto -c -k --keepParent ttrace.app ../../ttrace-gui-macos.zip
          ls -la ../../ttrace-gui-macos.zip

      # Unpacks the zip as people download it, opens the window, traces a
      # host and checks that results and places arrived; keeps a picture.
      - name: Self-test
        timeout-minutes: 6
        run: |
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          ditto -x -k "$GITHUB_WORKSPACE/ttrace-gui-macos.zip" .
          RES="$RUNNER_TEMP/selftest.txt"
          # started the way a double click starts it
          open -n -W ./ttrace.app --args --selftest "$RES" 1.1.1.1 &
          PID=$!
          sleep 30
          screencapture -x "$RUNNER_TEMP/screen.png" || echo "no screen picture"
          for i in $(seq 1 170); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          if kill -0 $PID 2>/dev/null; then pkill -f ttrace-gui || true; echo "the window did not finish in time"; fi
          wait $PID || true
          cat "$RES.log" || true
          test -f "$RES" || { echo "no result was written"; exit 1; }
          cat "$RES"
          ls -la "$RES.png" || { echo "no picture of the window"; exit 1; }
          grep -q '^ok ' "$RES"

      - name: Keep the picture of the window
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-window
          path: |
            ${{ runner.temp }}/selftest.txt.png
            ${{ runner.temp }}/screen.png
          retention-days: 1
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ttrace-gui-macos.zip --clobber
